<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8f6;--card:#fff;--tx:#2b2226;--mu:#7d6d73;--ac:#c2527a;--ac2:#fbe3ec;--bd:#eddfe3;--ok:#2e9d62;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1417;--card:#261d21;--tx:#f5eaee;--mu:#b5a3aa;--ac:#e8799f;--ac2:#3a2530;--bd:#3a2d33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1417;--card:#261d21;--tx:#f5eaee;--mu:#b5a3aa;--ac:#e8799f;--ac2:#3a2530;--bd:#3a2d33;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:24px;font-weight:800;color:var(--ac);flex:1}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:10px}
.pr{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.dg{color:#d33;border-color:#d33}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:10px 0}
.chip{white-space:nowrap;border-radius:99px}.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.im{aspect-ratio:1;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover}
.card .b{padding:10px}.nm{font-weight:600;font-size:14px}.pc{color:var(--ac);font-weight:800}.old{color:var(--mu);text-decoration:line-through;font-size:12px;margin-inline-start:6px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:#444;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:600px){.mo{align-items:center}.md{border-radius:18px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px}
.row .th{width:52px;height:52px;border-radius:8px;background:var(--ac2);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.row .th img{width:100%;height:100%;object-fit:cover}.row .i{flex:1;min-width:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.gal{display:flex;gap:8px;overflow-x:auto}.gal img{width:78%;max-width:300px;aspect-ratio:1;object-fit:cover;border-radius:12px;flex:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:40}
a.wa{display:block;text-align:center;background:var(--ok);color:#fff;text-decoration:none;padding:12px;border-radius:12px;font-weight:800;margin-top:14px}
.mu{color:var(--mu);font-size:13px}
:root{--ac:#0e9f9a;--ac2:#e0f4f3;--bg:#f4f5f7;--bd:#e3e6ea;--yl:#ffd23f;--red:#e53935}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#2cc4bd;--ac2:#17302f;--bg:#15191b;--card:#1e2427;--bd:#2c3438;--tx:#eef3f4;--mu:#9fb0b4}}
:root[data-theme="dark"]{--ac:#2cc4bd;--ac2:#17302f;--bg:#15191b;--card:#1e2427;--bd:#2c3438;--tx:#eef3f4;--mu:#9fb0b4}
.top{background:#222;color:#fff;font-size:12px;text-align:center;padding:6px;margin:-16px -16px 12px}
.hd h1{font-size:28px;flex:none;letter-spacing:-.5px}.sr{flex:1;min-width:180px;display:flex}
.sr input{border-radius:0 8px 8px 0;border:2px solid var(--ac);border-left:0}
.sb{background:var(--ac);color:#fff;padding:8px 16px;border-radius:8px 0 0 8px;display:flex;align-items:center}
.nv{display:flex;gap:2px;overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:12px 0;align-items:stretch}
.nv a,.nv .all{padding:11px 16px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:14px}
.nv .all{background:var(--yl);color:#222;font-weight:800}.nv a:hover,.nv a.cur{color:var(--ac);box-shadow:inset 0 -3px var(--ac)}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.hb{background:linear-gradient(135deg,var(--ac),#064e5a);color:#fff;border-radius:10px;padding:28px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hb h2{margin:0;font-size:28px}.hb button{align-self:flex-start;background:#222;color:#fff;border-color:#222}
.hs{display:grid;gap:12px}.ht{border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:center;font-weight:800;cursor:pointer;color:#222}
.ht:nth-child(1){background:var(--yl)}.ht:nth-child(2){background:#ffe0e6}.ht .mu{color:#555}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hs{grid-template-columns:1fr 1fr}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;border-bottom:2px solid var(--bd)}
.sec h2{margin:0;font-size:18px;padding-bottom:6px;border-bottom:3px solid var(--ac);margin-bottom:-2px}
.yt{background:var(--yl);color:#222;font-size:12px;font-weight:700;padding:3px 12px;border-radius:4px}
.bt{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.bt div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:18px 6px;text-align:center;font-weight:700;cursor:pointer}
.card{border-radius:6px}.card .b{text-align:center}.old{color:var(--red)}.im{background:#fff;color:var(--ac)}.tag{background:var(--red)}
</style></head><body>

<script>
const S=JSON.parse(document.getElementById('data').textContent);
let view='shop',cat='all',q='',tab='products',ed=null,pd=null,sel={},dirty=false,owner=false,delId=null,msg='';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';
const list=s=>String(s||'').split(/[,،]/).map(x=>x.trim()).filter(Boolean);
const thumb=p=>p.imgs&&p.imgs[0]?`<img src="${esc(p.imgs[0])}" alt="">`:'🛍️';
const cats=()=>`<div class="chips"><button class="chip ${cat=='all'?'on':''}" data-a="cat" data-v="all">الكل</button>${S.cats.map(c=>`<button class="chip ${cat==c?'on':''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;

function shop(){
  const ps=S.products.filter(p=>p.on&&(cat=='all'||p.cat==cat)&&p.name.includes(q));
  return `<div class="top">🚚 توصيل لكل المحافظات · اطلبي بسهولة عبر واتساب</div>
  <header class="hd"><h1>${esc(S.store.name)}</h1><div class="sr"><input id="q" placeholder="ابحثي عن منتج…" value="${esc(q)}"><span class="sb">🔍</span></div>${owner?'<button class="pr" data-a="dash">⚙️ لوحة التحكم</button>':''}</header>
  <nav class="nv"><span class="all" data-a="cat" data-v="all">☰ كل الأقسام</span>${S.cats.map(c=>`<a class="${cat==c?'cur':''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</a>`).join('')}</nav>
  ${cat=='all'&&!q?hero():''}
  <div class="sec"><h2>${cat=='all'?'أحدث المنتجات':esc(cat)}</h2><span class="yt">${ps.length} منتج</span></div>
  <div class="grid">${ps.map(p=>`<div class="card" data-a="open" data-v="${p.id}"><div class="im">${thumb(p)}</div>${p.stock<=0?'<span class="tag">نفد</span>':''}<div class="b"><div class="nm">${esc(p.name)}</div><span class="pc">${money(p.price)}</span>${p.old>p.price?`<span class="old">${money(p.old)}</span>`:''}</div></div>`).join('')||'<p class="mu">مفيش منتجات في القسم ده دلوقتي.</p>'}</div>${pd?prod():''}`;
}
function hero(){
  const c=S.cats;
  return `<div class="hero"><div class="hb"><h2>أحدث صيحات ${esc(S.store.name)}</h2><div>إكسسوارات · ميكاب · هدوم بأسعار حلوة</div><button data-a="cat" data-v="${esc(c[0]||'all')}">تسوقي الآن</button></div><div class="hs"><div class="ht" data-a="cat" data-v="${esc(c[1]||'all')}">${esc(c[1]||'عروض')}<span class="mu">اكتشفي الجديد</span></div><div class="ht" data-a="cat" data-v="${esc(c[2]||'all')}">${esc(c[2]||'جديد')}<span class="mu">اكتشفي الجديد</span></div></div></div>
  <div class="sec"><h2>تسوقي حسب القسم</h2></div><div class="bt">${c.map(x=>`<div data-a="cat" data-v="${esc(x)}">${esc(x)}</div>`).join('')}</div>`;
}
function prod(){
  const p=pd,msgT=`أهلاً، عايز أطلب: ${p.name}${sel.size?' - مقاس '+sel.size:''}${sel.color?' - لون '+sel.color:''} - السعر ${p.price} ج.م`;
  const ch=(k,arr)=>arr.length?`<label>${k=='size'?'المقاس':'اللون'}</label><div class="chips">${arr.map(v=>`<button class="chip ${sel[k]==v?'on':''}" data-a="sel" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`:'';
  return `<div class="mo" data-a="close"><div class="md" data-a="stop"><button data-a="close">✕</button>
  ${p.imgs.length?`<div class="gal">${p.imgs.map(i=>`<img src="${esc(i)}" alt="">`).join('')}</div>`:`<div class="im" style="border-radius:12px;height:160px">🛍️</div>`}
  <h2 style="margin:10px 0 0">${esc(p.name)}</h2><div class="mu">${esc(p.cat)}</div>
  <div><span class="pc" style="font-size:20px">${money(p.price)}</span>${p.old>p.price?`<span class="old">${money(p.old)}</span>`:''}</div>
  <p>${esc(p.desc)}</p>${ch('size',p.sizes)}${ch('color',p.colors)}
  ${p.stock<=0?'<p class="dg" style="border:0">المنتج غير متوفر حالياً</p>':(S.store.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(S.store.wa)}?text=${encodeURIComponent(msgT)}">اطلب عبر واتساب</a>`:'<p class="mu">لسه مفيش رقم واتساب للطلب.</p>')}</div></div>`;
}
function dash(){
  let body='';
  if(tab=='products'){
    body=`<button class="pr" data-a="new">＋ منتج جديد</button><div style="height:10px"></div>`+S.products.map(p=>`<div class="row"><div class="th">${thumb(p)}</div><div class="i"><b>${esc(p.name)}</b> ${p.on?'':'<span class="mu">(مخفي)</span>'}<div class="mu">${esc(p.cat)} · ${money(p.price)} · مخزون ${p.stock}</div></div><button data-a="edit" data-v="${p.id}">تعديل</button><button class="dg" data-a="del" data-v="${p.id}">${delId==p.id?'تأكيد الحذف؟':'حذف'}</button></div>`).join('');
  }else if(tab=='cats'){
    body=`<div class="row"><input id="nc" placeholder="اسم قسم جديد"><button class="pr" data-a="addcat">إضافة</button></div>`+S.cats.map(c=>`<div class="row"><div class="i">${esc(c)} <span class="mu">(${S.products.filter(p=>p.cat==c).length} منتج)</span></div><button data-a="rencat" data-v="${esc(c)}">تغيير الاسم</button><button class="dg" data-a="delcat" data-v="${esc(c)}">حذف</button></div>`).join('');
  }else{
    body=`<label>اسم المتجر</label><input id="sn" value="${esc(S.store.name)}"><label>رقم واتساب (بكود الدولة بدون +، مثال 201001234567)</label><input id="sw" value="${esc(S.store.wa)}" inputmode="numeric"><br><br><button class="pr" data-a="sets">حفظ الإعدادات</button>`;
  }
  return `<div class="bar"><button data-a="shop">← المتجر</button><b style="flex:1">لوحة التحكم</b><button class="pr" data-a="pub">${dirty?'🔴 نشر التغييرات':'✓ كل حاجة منشورة'}</button></div>
  <div class="chips">${[['products','المنتجات'],['cats','الأقسام'],['set','الإعدادات']].map(([k,t])=>`<button class="chip ${tab==k?'on':''}" data-a="tab" data-v="${k}">${t}</button>`).join('')}</div>${body}
  <p class="mu">التعديلات بتتحفظ مؤقتاً لحد ما تدوسي "نشر التغييرات" ويظهروا للزبائن.</p>${ed?form():''}`;
}
function form(){
  const p=ed;
  return `<div class="mo"><div class="md"><h3 style="margin-top:0">${p.isNew?'منتج جديد':'تعديل المنتج'}</h3>
  <label>اسم المنتج</label><input id="f_name" value="${esc(p.name)}">
  <div class="g2"><div><label>القسم</label><select id="f_cat">${S.cats.map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>المخزون (كمية)</label><input id="f_stock" type="number" min="0" value="${p.stock}"></div>
  <div><label>السعر (ج.م)</label><input id="f_price" type="number" min="0" value="${p.price}"></div><div><label>السعر قبل الخصم (اختياري)</label><input id="f_old" type="number" min="0" value="${p.old||''}"></div></div>
  <label>المقاسات (افصلي بفاصلة: S, M, L)</label><input id="f_sizes" value="${esc(p.sizes.join(', '))}">
  <label>الألوان (افصلي بفاصلة)</label><input id="f_colors" value="${esc(p.colors.join('، '))}">
  <label>الوصف</label><textarea id="f_desc" rows="3">${esc(p.desc)}</textarea>
  <label>الصور</label><input id="f_file" type="file" accept="image/*" multiple>
  <div class="thumbs">${p.imgs.map((i,n)=>`<img src="${esc(i)}" data-a="rmimg" data-v="${n}" title="اضغطي للحذف" alt="">`).join('')}</div>
  <label><input type="checkbox" id="f_on" style="width:auto" ${p.on?'checked':''}> ظاهر في المتجر</label><br>
  <div style="display:flex;gap:8px"><button class="pr" data-a="saveP" style="flex:1">حفظ</button><button data-a="cancelP">إلغاء</button></div></div></div>`;
}
function draw(){
  const keep=document.activeElement&&document.activeElement.id;
  app.innerHTML=(view=='dash'&&owner)?dash():shop();
  if(msg){app.insertAdjacentHTML('beforeend',`<div class="toast">${esc(msg)}</div>`);}
  if(keep=='q'){const e=document.getElementById('q');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
}
function toast(t){msg=t;draw();setTimeout(()=>{msg='';draw()},2200)}
function readForm(){
  const v=id=>document.getElementById(id).value;
  Object.assign(ed,{name:v('f_name').trim()||'منتج بدون اسم',cat:v('f_cat'),stock:+v('f_stock')||0,price:+v('f_price')||0,old:+v('f_old')||0,sizes:list(v('f_sizes')),colors:list(v('f_colors')),desc:v('f_desc'),on:document.getElementById('f_on').checked});
}
function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}
async function publish(){
  const a=await claude.use('artifact');
  if(!a){toast('النشر غير متاح هنا');return}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  toast('جاري النشر…');
  try{await a.publish('<!DOCTYPE html>\n'+c.outerHTML);dirty=false}catch(e){toast('تعذر النشر: '+(e.code||''))}
}
app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,v=t.dataset.v;
  if(a=='stop'&&e.target===t)return;
  if(a=='close'&&e.target!==t&&!t.matches('button'))return;
  if(a=='stop')return;
  if(a=='cat'){cat=v}
  else if(a=='open'){pd=S.products.find(p=>p.id==v);sel={}}
  else if(a=='close'){pd=null}
  else if(a=='sel'){sel[t.dataset.k]=sel[t.dataset.k]==v?null:v}
  else if(a=='dash'){view='dash'}else if(a=='shop'){view='shop'}
  else if(a=='tab'){tab=v}
  else if(a=='new'){ed={isNew:true,id:'p'+Date.now(),name:'',cat:S.cats[0]||'',price:0,old:0,desc:'',sizes:[],colors:[],stock:1,imgs:[],on:true}}
  else if(a=='edit'){ed=JSON.parse(JSON.stringify(S.products.find(p=>p.id==v)))}
  else if(a=='cancelP'){ed=null}
  else if(a=='rmimg'){readForm();ed.imgs.splice(+v,1)}
  else if(a=='saveP'){readForm();const n=ed.isNew;delete ed.isNew;if(n)S.products.unshift(ed);else S.products=S.products.map(p=>p.id==ed.id?ed:p);ed=null;dirty=true}
  else if(a=='del'){if(delId==v){S.products=S.products.filter(p=>p.id!=v);delId=null;dirty=true}else delId=v}
  else if(a=='addcat'){const n=document.getElementById('nc').value.trim();if(n&&!S.cats.includes(n)){S.cats.push(n);dirty=true}}
  else if(a=='rencat'){const n=prompt('الاسم الجديد',v);if(n&&n.trim()){S.cats=S.cats.map(c=>c==v?n.trim():c);S.products.forEach(p=>{if(p.cat==v)p.cat=n.trim()});dirty=true}}
  else if(a=='delcat'){if(S.products.some(p=>p.cat==v)){toast('انقلي المنتجات لقسم تاني الأول')}else{S.cats=S.cats.filter(c=>c!=v);dirty=true}}
  else if(a=='sets'){S.store.name=document.getElementById('sn').value.trim()||'متجري';S.store.wa=document.getElementById('sw').value.replace(/\D/g,'');dirty=true;document.title=S.store.name}
  else if(a=='pub'){await publish();return}
  draw();
});
app.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;draw()}});
app.addEventListener('change',async e=>{
  if(e.target.id=='f_file'&&ed){const fs=[...e.target.files];readForm();for(const f of fs){ed.imgs.push(await shrink(f))}draw()}
});
document.title=S.store.name;
draw();
(async()=>{try{const u=await claude.use('user');owner=!!(u&&u.isOwner());}catch(_){}draw()})();
</script>
